# Phase 3 - MobileNetV2 linear probe (E2): frozen ImageNet backbone, only classifier[1] is trained.
# Frozen protocol: docs/phase3_protocol.md §6. Every value is recorded in run.json.

experiment: mobilenetv2_probe

model:
  name: mobilenetv2
  num_classes: 6
  pretrained: true
  freeze_backbone: true

data:
  batch_size: 32
  # Same train-only augmentations as Phase 2 (justified in configs/custom_cnn.yaml).
  augment:
    hflip: 0.5
    vflip: 0.5
    brightness: 0.2
    contrast: 0.2
  # Grey channel replicated to 3 channels + ImageNet normalisation (protocol §4),
  # identical for the pretrained and from-scratch torchvision models.
  input:
    channels: 3
    normalization: imagenet

training:
  max_epochs: 60            # virtual epochs of 1 260 samples in E3 (40 steps each)
  lr: 1.0e-3     # head only (backbone frozen, BatchNorm in eval mode)
  weight_decay: 0.0
  scheduler_factor: 0.5     # ReduceLROnPlateau on val loss, applied to every group
  scheduler_patience: 3
  min_lr: 1.0e-6
  early_stopping_patience: 8
  min_delta: 0.0
  amp: true
  deterministic: true

seeds: [42, 123, 2026]
